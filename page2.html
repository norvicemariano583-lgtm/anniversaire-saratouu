<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pour Saratouuuu ❤️</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Dancing+Script:wght@500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- CSS de la page -->
    <link rel="stylesheet" href="page2.css">
</head>

<body>

    <!-- Décorations -->
    <div class="decor decor-1">✦</div>
    <div class="decor decor-2">♡</div>
    <div class="decor decor-3">✦</div>
    <div class="decor decor-4">♡</div>


    <main class="memory-page">

        <!-- En-tête -->
        <header class="memory-header">

            <div class="small-star">✦</div>

            <h1>
                Pour toi, Saratouuuu ❤️
            </h1>

            <p>
                Quelques souvenirs, juste pour te rappeler
                à quel point tu es précieuse.
            </p>

        </header>


        <!-- Cœur de photos -->
        <section class="heart-section">

            <div class="heart-gallery">

                <!-- Photo 1 -->
                <div class="photo photo-1">
                    <img
                        src="assets/photo1.jpg"
                        alt="Souvenir de Saratouuuu"
                    >
                </div>

                <!-- Photo 2 -->
                <div class="photo photo-2">
                    <img
                        src="assets/photo2.jpg"
                        alt="Souvenir de Saratouuuu"
                    >
                </div>

                <!-- Photo 3 -->
                <div class="photo photo-3">
                    <img
                        src="assets/photo3.jpg"
                        alt="Souvenir de Saratouuuu"
                    >
                </div>

                <!-- Photo 4 -->
                <div class="photo photo-4">
                    <img
                        src="assets/photo4.jpg"
                        alt="Souvenir de Saratouuuu"
                    >
                </div>

                <!-- Photo 5 -->
                <div class="photo photo-5">
                    <img
                        src="assets/photo5.jpg"
                        alt="Souvenir de Saratouuuu"
                    >
                </div>

                <!-- Photo 6 -->
                <div class="photo photo-6">
                    <img
                        src="assets/photo6.jpg"
                        alt="Souvenir de Saratouuuu"
                    >
                </div>

                <!-- Photo 7 -->
                <div class="photo photo-7">
                    <img
                        src="assets/photo7.jpg"
                        alt="Souvenir de Saratouuuu"
                    >
                </div>

                <!-- Photo 8 -->
                <div class="photo photo-8">
                    <img
                        src="assets/photo8.jpg"
                        alt="Souvenir de Saratouuuu"
                    >
                </div>

                <!-- Photo 9 -->
                <div class="photo photo-9">
                    <img
                        src="assets/photo9.jpg"
                        alt="Souvenir de Saratouuuu"
                    >
                </div>


                <!-- Bouton musique au centre -->
                <div class="music-center">

                    <button
                        id="musicButton"
                        class="music-button"
                        aria-label="Lancer la musique"
                    >
                        <span id="musicIcon">▶</span>
                    </button>

                    <div class="music-label">
                        Happy Birthday 🎂
                    </div>

                </div>

            </div>

        </section>


        <!-- Message final -->
        <section class="final-message">

            <div class="message-line">
                <span></span>
                <span>♡</span>
                <span></span>
            </div>

            <p>
                Que cette nouvelle année de ta vie soit remplie
                de beaux souvenirs, de bonheur et de belles surprises. ✨
            </p>

            <h2>
                Joyeux anniversaire ❤️
            </h2>

            <p class="signature">
                Profite pleinement de ta journée. 🥳
            </p>

        </section>


        <!-- Audio -->
        <audio
            id="birthdayMusic"
            src="assets/Happy-Birthday.mp3"
            loop
        ></audio>

    </main>


    <!-- JavaScript -->
    <script src="page2.js"></script>

</body>
</html>
